name: ORIGEN Browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'mundo.js'
      - 'supabase-client.js'
      - 'trust.js'
      - 'styles.css'
      - 'data.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - '_headers'
      - 'scripts/build-static.mjs'
      - 'tests/browser-smoke.mjs'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: origen-browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.55.0-${{ runner.os }}
      - name: Build deployable bundle
        run: npm run check:release
      - name: Install pinned Playwright runner
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 >/tmp/origen-browser-qa-server.log 2>&1 &
          echo $! > /tmp/origen-browser-qa-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/dist/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/origen-browser-qa-server.log
          exit 1
      - name: Run Chromium browser QA
        env:
          ORIGEN_BASE_URL: http://127.0.0.1:4173/dist/
        run: node tests/browser-smoke.mjs
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: origen-browser-qa-server-log-${{ github.run_number }}
          path: /tmp/origen-browser-qa-server.log
          if-no-files-found: ignore
          retention-days: 7
