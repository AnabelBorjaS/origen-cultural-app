name: Build portable ORIGEN preview
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check application syntax
        run: |
          npm run check
          node --check mundo.js
      - name: Build public assets
        run: python3 scripts/build-static.py
      - uses: actions/upload-artifact@v4
        with:
          name: origen-static-preview
          path: dist/
          include-hidden-files: true
          retention-days: 14
